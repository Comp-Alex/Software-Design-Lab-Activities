name: Update engineering dashboard

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh repository snapshot
        run: python dashboard/scripts/update_dashboard.py

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- dashboard/data/project.json; then
            echo "Dashboard snapshot has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/project.json
          git commit -m "chore: refresh engineering dashboard data"
          git push
